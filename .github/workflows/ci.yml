name: CI pipeline

on: 
  push:
    branches: [main, master]
  pull_request: 
    branches: [main, master]

jobs: 
  test:
    name: Run tests and build
    runs-on: ubuntu-latest

    #  Indented steps inside the 'test' job
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: 22 # Updated to the current stable LTS version
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci # Fixed from 'runs: npm CI' (must be lowercase 'run' and lowercase 'ci')

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps # Required so Playwright works inside Ubuntu CI

      - name: Run Unit & Integration Tests (Vitest)
        run: npm run test:unit

      - name: Run E2E Tests (Playwright)
        run: npm run test:e2e

      - name: Build Next.js App
        run: npm run build
